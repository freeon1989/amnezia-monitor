# Сборка Amnezia Monitor для macOS (.app в zip и .dmg) на GitHub-hosted macOS.
# На Linux-машине сборщика нет macOS SDK, поэтому окно SwiftUI собирается только здесь.
# Подпись ad-hoc, без Apple Developer ID. Релиз не публикуется — только артефакты.
name: Build macOS app

on:
  push:
    branches:
      - "main"
      - "cursor/**"
    tags:
      - "v*"
    paths:
      - "macos/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: macos/AmneziaMonitor
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version && swift --version

      - name: Core tests (swift test)
        run: swift test

      - name: Build app (Release, ad-hoc signed)
        run: |
          set -euo pipefail
          xcodebuild \
            -project AmneziaMonitor.xcodeproj \
            -scheme AmneziaMonitor \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            build
          test -d build/Build/Products/Release/AmneziaMonitor.app
          codesign --force --deep --sign - build/Build/Products/Release/AmneziaMonitor.app
          codesign --verify --verbose build/Build/Products/Release/AmneziaMonitor.app

      - name: Package zip and dmg
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APP=build/Build/Products/Release/AmneziaMonitor.app
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/dist/AmneziaMonitor-macos-v1.2.0.zip"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Amnezia Monitor" -srcfolder "$STAGE" -ov -format UDZO \
            "$GITHUB_WORKSPACE/dist/AmneziaMonitor-macos-v1.2.0.dmg"
          cd "$GITHUB_WORKSPACE/dist"
          shasum -a 256 AmneziaMonitor-macos-v1.2.0.zip > AmneziaMonitor-macos-v1.2.0.zip.sha256
          shasum -a 256 AmneziaMonitor-macos-v1.2.0.dmg > AmneziaMonitor-macos-v1.2.0.dmg.sha256
          cat ./*.sha256

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaMonitor-macos-v1.2.0
          path: dist/*
          if-no-files-found: error
          retention-days: 14
