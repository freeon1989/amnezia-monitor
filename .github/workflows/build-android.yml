# Сборка Android-клиента (debug APK) и unit-тесты. Релиз не публикуется — только артефакты.
name: Build Android app

on:
  push:
    branches:
      - "main"
      - "cursor/**"
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Unit tests and APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/dist/AmneziaMonitor-android-v1.2.0.apk"
          cd "$GITHUB_WORKSPACE/dist" && sha256sum AmneziaMonitor-android-v1.2.0.apk > AmneziaMonitor-android-v1.2.0.apk.sha256
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaMonitor-android-v1.2.0
          path: dist/*
          if-no-files-found: error
          retention-days: 14
